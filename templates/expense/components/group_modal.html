<!-- Group Creation Modal -->
<div class="modal fade modal-enhanced" id="groupCreateModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content glass-card">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-700">
                    <i class="bi bi-people-plus"></i> Create New Group
                </h5>
                <button type="button" class="btn-close btn-close-light" data-bs-dismiss="modal"></button>
            </div>
            <form method="post" action="{% url 'group-create' %}" id="groupForm">
                {% csrf_token %}
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="groupName" class="form-label fw-600">Group Name</label>
                        <input type="text" class="form-control modal-input" id="groupName" name="name" placeholder="e.g., Trip to Europe" required autofocus>
                        <small class="text-muted">Give your group a descriptive name</small>
                    </div>

                    <div class="mb-3">
                        <label for="groupDescription" class="form-label fw-600">Description (optional)</label>
                        <textarea class="form-control modal-input" id="groupDescription" name="description" rows="3" placeholder="Add details about this group..."></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-600">Add Members</label>
                        <div id="membersList" class="member-list">
                            <div class="member-input-group">
                                <input type="email" class="form-control modal-input" placeholder="member@email.com" name="members">
                                <button type="button" class="btn btn-sm btn-outline-secondary remove-member" style="display: none;">
                                    <i class="bi bi-x"></i>
                                </button>
                            </div>
                        </div>
                        <button type="button" class="btn btn-sm btn-outline-secondary mt-2" id="addMemberBtn">
                            <i class="bi bi-plus"></i> Add Another Member
                        </button>
                        <small class="text-muted d-block mt-2">Members can be added or changed later</small>
                    </div>
                </div>

                <div class="modal-footer border-0 pt-2 gap-2">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle"></i> Create Group
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
.member-list {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
}

.member-input-group {
    display: flex;
    gap: 0.5rem;
    align-items: center;
}

.member-input-group .form-control {
    flex: 1;
}

.member-input-group .remove-member {
    flex-shrink: 0;
}

.modal-enhanced .modal-input:focus {
    background: var(--input-bg-focus);
    border-color: var(--accent-3);
    box-shadow: 0 0 0 3px rgba(var(--accent-3-rgb), 0.1);
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const membersList = document.getElementById('membersList');
    const addMemberBtn = document.getElementById('addMemberBtn');
    
    if (!membersList || !addMemberBtn) return;

    function updateRemoveButtons() {
        const groups = membersList.querySelectorAll('.member-input-group');
        groups.forEach((group, index) => {
            const removeBtn = group.querySelector('.remove-member');
            removeBtn.style.display = groups.length > 1 ? 'block' : 'none';
        });
    }

    addMemberBtn.addEventListener('click', function() {
        const newGroup = document.createElement('div');
        newGroup.className = 'member-input-group';
        newGroup.innerHTML = `
            <input type="email" class="form-control modal-input" placeholder="member@email.com" name="members">
            <button type="button" class="btn btn-sm btn-outline-secondary remove-member">
                <i class="bi bi-x"></i>
            </button>
        `;
        
        newGroup.querySelector('.remove-member').addEventListener('click', function(e) {
            e.preventDefault();
            newGroup.remove();
            updateRemoveButtons();
        });
        
        membersList.appendChild(newGroup);
        updateRemoveButtons();
    });

    membersList.addEventListener('click', function(e) {
        if (e.target.closest('.remove-member')) {
            e.preventDefault();
            e.target.closest('.member-input-group').remove();
            updateRemoveButtons();
        }
    });

    updateRemoveButtons();
});
</script>
