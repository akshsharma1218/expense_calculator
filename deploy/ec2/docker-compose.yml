name: expense-calculator

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    mem_limit: 192m
    command: ["postgres", "-c", "shared_buffers=48MB", "-c", "max_connections=20", "-c", "work_mem=2MB"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in deploy/ec2/.env.docker}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in deploy/ec2/.env.docker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/ec2/.env.docker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/001-create-expense-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: ../..
      dockerfile: Dockerfile.micro
    platform: linux/amd64
    restart: unless-stopped
    init: true
    mem_limit: 320m
    cpus: 0.75
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py create_superuser --noinput && python manage.py create_categories --noinput && python manage.py collectstatic --noinput --clear && exec daphne -b 0.0.0.0 -p 8000 expense_calculator.asgi:application"]
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in deploy/ec2/.env.docker}
      ALLOWED_HOSTS: ${DOMAIN:?Set DOMAIN in deploy/ec2/.env.docker},www.${DOMAIN},localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: https://${DOMAIN:?Set DOMAIN in deploy/ec2/.env.docker},https://www.${DOMAIN}
      CORS_ALLOWED_ORIGINS: https://${DOMAIN:?Set DOMAIN in deploy/ec2/.env.docker},https://www.${DOMAIN}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-31536000}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in deploy/ec2/.env.docker}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in deploy/ec2/.env.docker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/ec2/.env.docker}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      DB_HOST: postgres
      DB_PORT: "5432"
      DATABASE_CONN_MAX_AGE: "60"
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
      STATIC_ROOT: /app/staticfiles
      MEDIA_ROOT: /app/media
      LOG_LEVEL: INFO
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@example.com}
      SERVER_EMAIL: ${SERVER_EMAIL:-server@example.com}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - staticfiles:/app/staticfiles
      - mediafiles:/app/media
      - application_logs:/app/logs

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 64m
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in deploy/ec2/.env.docker}
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - staticfiles:/srv:ro
      - mediafiles:/media:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  staticfiles:
  mediafiles:
  application_logs:
  caddy_data:
  caddy_config:
